# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# site-audit — SEO + GEO audit of one site, v1 surface (2026-07).
#
# The honest core funnel: GEO discovery (robots.txt · llms.txt) → sitemap →
# a bounded same-origin crawl → deterministic heuristics (jq · the one data
# language) → ONE bounded model call for the narrative verdict → a
# deterministic chart artifact + an HTML report. Audit-before-run applies:
# `nika check site-audit.nika.yaml` prints the plan, the cost ceiling and
# the permits boundary before a single request leaves.
#
# The 2024-era 1072-line pipeline lives at legacy/site-audit-v10.nika.yaml
# (read-only reference — pre-v1 surface, does not parse on current engines).
nika: v1
workflow:
  id: site-audit
  description: "SEO + GEO site audit — discover, crawl bounded, score deterministically, one narrated verdict, artifacts as receipts"

model: mock/echo # offline default — override live: --model anthropic/claude-sonnet-4-6 (or any provider/model)

vars:
  url:
    type: string
    default: "https://qrcode-ai.com"
    description: "Site origin to audit (scheme + host, no trailing slash)"

permits:
  exec: false
  net:
    http: ["qrcode-ai.com"] # widen with the audited host when overriding vars.url
  fs:
    read: ["skills/**"]
    write: ["out/**"]
  tools:
    [
      "nika:fetch",
      "nika:jq",
      "nika:chart",
      "nika:read",
      "nika:write",
      "nika:log",
    ]

tasks:
  # ── GEO discovery (parallel wave) ──────────────────────────────────
  robots:
    invoke:
      tool: "nika:fetch"
      args: { url: "${{ vars.url }}/robots.txt", mode: text }
    on_error:
      recover: "" # a missing robots.txt is a FINDING, not a crash

  llmstxt:
    invoke:
      tool: "nika:fetch"
      args: { url: "${{ vars.url }}/llms.txt", mode: text }
    on_error:
      recover: "" # absence recorded · scored below

  sitemap:
    invoke:
      tool: "nika:fetch"
      args: { url: "${{ vars.url }}/sitemap.xml", mode: sitemap }
    retry: { max_attempts: 2, backoff_ms: 2000 }
    on_error:
      recover: "[]" # spider-mode fallback: the crawl still samples

  # ── Bounded same-origin crawl (the sampler) ───────────────────────
  crawl:
    invoke:
      tool: "nika:fetch"
      args:
        url: "${{ vars.url }}"
        traverse: { max_pages: 8, respect_robots: true }
    retry: { max_attempts: 2, backoff_ms: 2000 }

  # ── Deterministic heuristics — jq is the one data language ────────
  geo_score:
    depends_on: [robots, llmstxt]
    invoke:
      tool: "nika:jq"
      args:
        input:
          robots: "${{ tasks.robots.output }}"
          llms: "${{ tasks.llmstxt.output }}"
        expression: >-
          {
            has_robots: (.robots | length > 0),
            has_llmstxt: (.llms | length > 0),
            ai_crawlers_addressed: (.robots | test("GPTBot|ClaudeBot|Claude-Web|PerplexityBot|Google-Extended"; "i")),
            geo_points: (
              (if (.robots | length > 0) then 40 else 0 end) +
              (if (.llms | length > 0) then 40 else 0 end) +
              (if (.robots | test("GPTBot|ClaudeBot|Claude-Web|PerplexityBot|Google-Extended"; "i")) then 20 else 0 end)
            )
          }

  seo_score:
    depends_on: [crawl, sitemap]
    invoke:
      tool: "nika:jq"
      args:
        input:
          pages: "${{ tasks.crawl.output }}"
          sitemap: "${{ tasks.sitemap.output }}"
        # The health score follows skills/seo-auditor.md §Scoring — the
        # rows the crawl digest can PROVE (title · description · status ·
        # thin text · long title); per-group rules (duplicates · orphans ·
        # chains) need a full crawl, out of the 8-page sample's honesty.
        expression: >-
          (.pages.pages // []) as $p | ($p | length) as $n |
          {
            pages_sampled: $n,
            with_title: [$p[] | select((.title // "") | length > 0)] | length,
            with_description: [$p[] | select((.description // "") | length > 0)] | length,
            broken: [$p[] | select((.status // 200) >= 400)] | length,
            thin: [$p[] | select((.text // "") | length < 200)] | length,
            long_titles: [$p[] | select((.title // "") | length > 60)] | length,
            sitemap_urls: (.sitemap | if type == "array" then length else 0 end),
            health: ([100
              - (($n - ([$p[] | select((.title // "") | length > 0)] | length)) * 3)
              - (($n - ([$p[] | select((.description // "") | length > 0)] | length)) * 2)
              - (([$p[] | select((.status // 200) >= 400)] | length) * 5)
              - (([$p[] | select((.text // "") | length < 200)] | length) * 1)
              - (([$p[] | select((.title // "") | length > 60)] | length) * 1)
              , 0] | max),
            seo_points: (
              (if $n == 0 then 0 else
                ((([$p[] | select((.title // "") | length > 0)] | length) * 50 / $n) +
                 (([$p[] | select((.description // "") | length > 0)] | length) * 30 / $n)) end) +
              (if (.sitemap | if type == "array" then length else 0 end) > 0 then 20 else 0 end)
            ) | floor
          }

  # ── The chart artifact — deterministic scorecard, sha in the trace ─
  scorecard:
    depends_on: [geo_score, seo_score]
    invoke:
      tool: "nika:chart"
      args:
        data:
          - { axis: "GEO readiness", points: "${{ tasks.geo_score.output.geo_points }}" }
          - { axis: "SEO hygiene", points: "${{ tasks.seo_score.output.seo_points }}" }
          - { axis: "Health (rubric)", points: "${{ tasks.seo_score.output.health }}" }
        semantics: { axis: category, points: count }
        chart:
          {
            type: bar,
            x: axis,
            y: points,
            title: "Site audit scorecard",
          }
        out: out/scorecard.svg

  # ── ONE bounded model call — the narrated verdict ──────────────────
  # The auditor rubric (skills/seo-auditor.md · scoring rules · severity
  # vocabulary) rides as the SYSTEM prompt — read at run, never inlined
  # (the v1 form of the legacy `skills:` auto-injection).
  rubric:
    invoke:
      tool: "nika:read"
      args: { path: skills/seo-auditor.md }

  verdict:
    depends_on: [geo_score, seo_score, rubric]
    infer:
      system: "${{ tasks.rubric.output }}"
      prompt: >-
        Facts (deterministic, already computed by the workflow):
        GEO ${{ tasks.geo_score.output }} · SEO ${{ tasks.seo_score.output }}.
        Using the scoring rules and severity vocabulary above, write a
        3-sentence verdict: the single biggest gap (with its severity
        class), the quickest win, and one structural recommendation.
        Plain prose, no headings.
      max_tokens: 300

  # ── The report — one HTML artifact, receipts inline ────────────────
  report:
    depends_on: [verdict, scorecard, geo_score, seo_score]
    invoke:
      tool: "nika:write"
      args:
        path: out/report.html
        content: |
          <!doctype html>
          <meta charset="utf-8">
          <title>Site audit — ${{ vars.url }}</title>
          <style>body{font:16px/1.5 system-ui;max-width:44rem;margin:3rem auto;padding:0 1rem}img{max-width:100%}code{background:#eee;padding:.1em .3em;border-radius:3px}</style>
          <h1>Site audit</h1>
          <p><code>${{ vars.url }}</code></p>
          <img src="scorecard.svg" alt="Scorecard: GEO readiness and SEO hygiene">
          <h2>Verdict</h2>
          <p>${{ tasks.verdict.output }}</p>
          <h2>Facts</h2>
          <pre>GEO ${{ tasks.geo_score.output }}
          SEO ${{ tasks.seo_score.output }}</pre>
          <p><small>Generated by <a href="https://nika.sh">nika</a> — the run's
          trace chain is the receipt (<code>nika trace verify</code>).</small></p>

  done:
    depends_on: [report]
    invoke:
      tool: "nika:log"
      args: { message: "audit complete → out/report.html · out/scorecard.svg" }

outputs:
  geo: "${{ tasks.geo_score.output }}"
  seo: "${{ tasks.seo_score.output }}"
  verdict: "${{ tasks.verdict.output }}"
