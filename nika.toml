[project]
name = "nika-site-audit"
description = "Full site audit workflow — crawl, enrich, analyze, report"

# Provider/model live IN the workflow envelope on the v1 surface
# (`model: mock/echo` offline default · --model overrides at run) —
# a config-level default here belonged to the legacy dialect.

[tools]
allow_exec = true
allow_network = true

[policy]
allow_exec = true
allow_network = true
fetch_allow = [
  "api.elevenlabs.io",
  "generativelanguage.googleapis.com",
]
fetch_robots_bypass = [
  "api.elevenlabs.io",
  "generativelanguage.googleapis.com",
]

[artifacts]
dir = "./artifacts"
